services:
  - type: web
    name: wealthos-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -e ."
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/finance.db
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false # Set this manually in the Render dashboard!
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
